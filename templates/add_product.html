{% extends 'base.html' %}

{% block title %}Добавить товар{% endblock %}

{% block content %}
    <div class="form-container">
        <h2>Добавить товар</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="form-btn">Добавить</button>
        </form>
    </div>
{% endblock %}
