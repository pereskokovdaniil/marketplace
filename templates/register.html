{% extends 'base.html' %}
{% load static %}

{% block title %}Регистрация{% endblock %}

{% block content %}
    <div class="form-container">
        <h2>Регистрация</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="form-btn">Зарегистрироваться</button>
        </form>
        <p class="form-link">Есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </div>

    <script src="{% static 'js/form.js' %}"></script>
{% endblock %}
