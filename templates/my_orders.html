{% extends 'base.html' %}

{% block title %}Мои заказы{% endblock %}

{% block content %}
    <div class="orders-container">
        <h2>Мои заказы</h2>
        {% for order in orders %}
            <div class="order-item">
                <p class="order-id">Заказ №{{ order.id }}</p>
                <p class="order-date">{{ order.created_at|date:"Y-m-d" }}</p>
                <p class="order-total">Сумма: {{ order.total }} руб.</p>
            </div>
        {% empty %}
            <p class="orders-empty">Заказов нет</p>
        {% endfor %}
    </div>
{% endblock %}
