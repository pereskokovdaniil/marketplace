{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
    <div class="form-container">
        <h2>Вход</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="form-btn">Войти</button>
        </form>
        <p class="form-link">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div>
{% endblock %}
