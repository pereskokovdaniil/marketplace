{% extends 'base.html' %}

{% block title %}Главная{% endblock %}

{% block content %}
    <div class="container">
    {% for product in products %}
        <div class="card">
            <a href="{% url 'product_detail' product.id %}">{{ product.name }}</a>
            {{ product.price }}
        </div>
    {% endfor %}
    </div>
{% endblock %}
