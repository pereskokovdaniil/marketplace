{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
    <div class="container">
        <a href="{% url 'index' %}">главная</a>
        {{ product.name }}<hr>
        {{ product.price }}<hr>
        {{ product.description }}<hr>
        {{ product.category }}<hr>
        {{ product.seller }}<hr>
        <a href="{% url 'add_cart' product.id %}">Добавить в корзину</a>
    </div>
{% endblock %}
